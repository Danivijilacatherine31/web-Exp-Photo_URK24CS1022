
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoEditor</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
        }

        #main_container {
            width: 85%;
            margin: auto;
            background-color: white;
            min-height: 100vh;
        }

        #navigation {
            background-color: #263b5e;
            padding: 20px;
            text-align: center;
        }

        #navigation h1 {
            color: white;
            margin-bottom: 20px;
        }

        #navigation a {
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 5px;
        }

        #navigation a:hover {
            background-color: #3498db;
            border-radius: 5px;
        }

        #main_content {
            text-align: center;
            padding: 50px 20px;
            background-color: #d6eaf8;
        }

        #main_content h2 {
            color: #263b5e;
        }

        #main_content p {
            font-size: 17px;
            line-height: 1.6;
        }

        button {
            background-color: #2874a6;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #154360;
        }

        #styling_options {
            text-align: center;
            padding: 35px;
        }

        #styling_options h2 {
            color: #263b5e;
        }
    </style>
</head>

<body>

    <!-- Main Container -->
    <div id="main_container">

        <!-- Navigation Section -->
        <div id="navigation">

            <h1>PhotoEditor</h1>

            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Design</a>
            <a href="#">Business</a>

        </div>

        <!-- Main Content Section -->
        <div id="main_content">

            <h2>Welcome to Photo Editor</h2>

            <p>
                Here at Photo Editor we provide exclusive options and suggestions
                to further enhance your photos with our styling methods and
                upload, edit and share instantly from one place.
            </p>

            <button>Upload Your Photo</button>

        </div>

        <!-- Styling Options Section -->
        <div id="styling_options">

            <h2>Styling Options</h2>

            <button>Filter</button>
            <button>Crop</button>
            <button>Draw</button>
            <button>Edit</button>

        </div>

    </div>

</body>
</html>
